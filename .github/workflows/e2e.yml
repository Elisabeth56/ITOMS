name: e2e

# The three critical flows in a real browser, against a local Supabase stack seeded with the
# demo data. Separate from the main check because it needs Docker and takes a few minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (database and auth only) and load the seed
        run: |
          pnpm exec supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,postgres-meta,supavisor,mailpit
          pnpm exec supabase db reset
          pnpm exec supabase status -o env > supabase.env

      - name: Write app settings from the local stack
        run: |
          set -a; source supabase.env; set +a
          {
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "WEB_ORIGIN=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "API_URL=http://localhost:4000"
          } >> "$GITHUB_ENV"

      - run: pnpm --filter @itoms/web build
      - run: pnpm --filter @itoms/web exec playwright install --with-deps chromium
      - run: pnpm --filter @itoms/web exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
